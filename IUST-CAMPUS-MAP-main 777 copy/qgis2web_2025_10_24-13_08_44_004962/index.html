        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }

        
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.update();
                    }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }

                interactive: true,
            }
        }
        map.createPane('pane_BUILDINGS_3');
        map.getPane('pane_BUILDINGS_3').style.zIndex = 403;
        map.getPane('pane_BUILDINGS_3').style['mix-blend-mode'] = 'normal';
        var layer_BUILDINGS_3 = new L.geoJson(json_BUILDINGS_3, {
            attribution: '',
            interactive: true,
            dataVar: 'json_BUILDINGS_3',
            layerName: 'layer_BUILDINGS_3',
            pane: 'pane_BUILDINGS_3',
            onEachFeature: pop_BUILDINGS_3,
            style: style_BUILDINGS_3_0,
        });
        bounds_group.addLayer(layer_BUILDINGS_3);
        map.addLayer(layer_BUILDINGS_3);
        setBounds();

       // ──────────────────────────────────────────────────────────────
// 6) COLLECT FEATURES FOR SEARCH + DROPDOWN
// ──────────────────────────────────────────────────────────────
var buildingFeatures = [];
layer_BUILDINGS_3.eachLayer(l => {
  var nm = l.feature.properties.Name;
  if (!nm) return;
  var ctr = l.getBounds().getCenter();
  buildingFeatures.push({ name: nm, layer: l, centroid: [ctr.lng, ctr.lat] });
});

// populate the “quick” building dropdown
var dd = document.getElementById('buildingDropdown');
buildingFeatures
  .sort((a, b) => a.name.localeCompare(b.name))
  .forEach(f => {
    var opt = document.createElement('option');
    opt.value = f.name;
    opt.text = f.name;
    dd.appendChild(opt);
  });

// on dropdown change — zoom to selected building
dd.addEventListener('change', function() {
  var sel = this.value;
  var bf = buildingFeatures.find(x => x.name === sel);
  if (!bf) return;
  map.fitBounds(bf.layer.getBounds());
  bf.layer.openPopup();
  bf.layer.setStyle({ color: '#00ff00', weight: 4 });
  setTimeout(() => layer_BUILDINGS_3.resetStyle(bf.layer), 2000);
});

// ──────────────────────────────────────────────────────────────
// 7) SEARCH BOX — Search Buildings + Roads
// ──────────────────────────────────────────────────────────────
var allFeatures = []
  .concat(
    buildingFeatures,
    layer_ROADS_0
      .getLayers()
      .map(l => ({ name: l.feature.properties.Name, layer: l }))
  );

document.getElementById('searchBtn').addEventListener('click', () => {
  var q = document.getElementById('customSearch').value.trim().toLowerCase();
  if (!q) return;
  var m = allFeatures.find(x => x.name && x.name.toLowerCase().includes(q));
  if (!m) {
    alert('No match found');
    return;
  }
  map.fitBounds(m.layer.getBounds());
  m.layer.openPopup();
  m.layer.setStyle({ color: '#00ff00', weight: 4 });
  setTimeout(() => {
    layer_BUILDINGS_3.resetStyle(m.layer);
    layer_NEWBUILDINGS_2.resetStyle(m.layer);
    layer_ROADS_0.resetStyle(m.layer);
  }, 2000);
});

// clear and Enter key handlers
document.getElementById('clearBtn').addEventListener('click', () => {
  document.getElementById('customSearch').value = '';
});

document.getElementById('customSearch').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('searchBtn').click();
});
// ──────────────────────────────────────────────────────────────
// 8) CURRENT LOCATION FEATURE
// ──────────────────────────────────────────────────────────────
let currentMarker = null;
let accuracyCircle = null;

document.getElementById('locateBtn').addEventListener('click', () => {
  if (!navigator.geolocation) {
    alert('Geolocation is not supported by your browser.');
    return;
  }

  navigator.geolocation.getCurrentPosition(
    position => {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const acc = position.coords.accuracy;

      // remove previous markers
      if (currentMarker) map.removeLayer(currentMarker);
      if (accuracyCircle) map.removeLayer(accuracyCircle);

      // add new marker + accuracy circle
      currentMarker = L.marker([lat, lng])
        .addTo(map)
        .bindPopup(`<b>You are here</b><br>Accuracy: ${Math.round(acc)} m`)
        .openPopup();

      accuracyCircle = L.circle([lat, lng], {
        radius: acc,
        color: '#007bff',
        fillColor: '#007bff',
        fillOpacity: 0.15
      }).addTo(map);

      // zoom to location
      map.setView([lat, lng], 18);
    },
    () => alert('Unable to retrieve your location.')
  );
});

        </script>        
    </body>
</html>
